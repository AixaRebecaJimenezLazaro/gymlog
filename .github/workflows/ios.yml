name: Compilar iOS (sin firmar)

on: workflow_dispatch

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generar proyecto iOS
        run: |
          cp lib/main.dart /tmp/main.bak
          flutter create --platforms=ios --org com.gymlog --project-name gymlog .
          cp /tmp/main.bak lib/main.dart
          rm -f test/widget_test.dart
          flutter pub get
          dart run flutter_launcher_icons
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName GymLog" ios/Runner/Info.plist

      - name: Compilar
        run: flutter build ios --release --no-codesign

      - name: Crear IPA
        run: |
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r GymLog.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: GymLog-ipa
          path: GymLog.ipa
